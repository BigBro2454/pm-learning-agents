[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-learning-agents"
version = "0.3.0"
description = "Applied AI Agent Architecture Lab: 4 production agent archetypes built on Google Gemini and Williams' Agent Framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ishan Dhiman", email = "product.ishand03@gmail.com" }
]
keywords = [
    "ai-agents",
    "google-gemini",
    "applied-ai",
    "product-management",
    "technical-product-manager",
    "multi-agent",
    "rag",
    "genai"
]
dependencies = [
    "google-genai>=0.2.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "feedparser>=6.0.11",
    "requests>=2.31.0",
    "chromadb>=0.5.0"
]

[project.urls]
Homepage = "https://github.com/BigBro2454/pm-learning-agents"
Repository = "https://github.com/BigBro2454/pm-learning-agents"

[project.scripts]
pm-agents = "run_lab:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["guardrails*", "hitl*", "telemetry*", "benchmarks*"]

[tool.setuptools]
py-modules = ["run_lab"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
