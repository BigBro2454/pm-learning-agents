[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-learning-agents"
version = "0.1.0"
description = "Applied AI Agent Architecture Lab: 4 production agent archetypes built on Google Gemini and Williams' Agent Framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ishan Dhiman", email = "product.ishand03@gmail.com" }
]
keywords = [
    "ai-agents",
    "google-gemini",
    "applied-ai",
    "product-management",
    "technical-product-manager",
    "multi-agent",
    "rag",
    "genai"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "google-genai>=0.2.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "feedparser>=6.0.11",
    "requests>=2.31.0",
    "chromadb>=0.5.0"
]

[project.urls]
Homepage = "https://github.com/BigBro2454/pm-learning-agents"
Repository = "https://github.com/BigBro2454/pm-learning-agents"

[project.scripts]
pm-agents = "run_lab:main"
